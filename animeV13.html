    <style>
        :root {
            --bg: #050505;
            --joe-red: #b31212;
            --joe-gold: #c49a45;
            --paper: #ede3d0;
        }

        body {
            background-color: var(--bg);
            color: var(--paper);
            font-family: 'Oswald', sans-serif;
            margin: 0;
            background-image: url('https://www.transparenttextures.com/patterns/dark-leather.png');
        }

        header {
            background: #000;
            border-bottom: 6px solid var(--joe-red);
            padding: 20px 5%;
            text-align: center;
        }

        .logo {
            font-family: 'Stalinist One', cursive;
            color: var(--joe-red);
            font-size: 2.5rem;
            text-shadow: 4px 4px 0px #000;
            letter-spacing: 2px;
        }

        .main-container {
            padding: 30px 5%;
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 30px;
        }

        .player-section {
            background: #000;
            border: 5px solid var(--joe-red);
            position: relative;
            box-shadow: 0 0 30px rgba(179, 18, 18, 0.5);
        }

        .video-wrap {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
        }

        .video-wrap iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
        }

        .episode-panel {
            background: #111;
            border: 2px solid var(--joe-gold);
            padding: 20px;
            height: fit-content;
        }

        /* ПЕРЕМИКАЧ СЕЗОНІВ */
        .season-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            background: #222;
            border: 2px solid #444;
            color: var(--paper);
            padding: 10px;
            font-family: 'Stalinist One';
            font-size: 0.7rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .tab-btn.active {
            border-color: var(--joe-red);
            background: var(--joe-red);
            color: white;
        }

        .panel-title {
            font-family: 'Stalinist One';
            color: var(--joe-gold);
            font-size: 0.9rem;
            margin-bottom: 15px;
            text-align: center;
        }

        .episodes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(50px, 1fr));
            gap: 8px;
            max-height: 500px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .episodes-grid::-webkit-scrollbar { width: 5px; }
        .episodes-grid::-webkit-scrollbar-thumb { background: var(--joe-red); }

        .ep-btn {
            background: #222;
            border: 1px solid #444;
            color: #fff;
            padding: 10px 5px;
            cursor: pointer;
            font-family: 'Oswald';
            font-weight: bold;
            transition: 0.2s;
            text-align: center;
        }

        .ep-btn:hover, .ep-btn.active {
            background: var(--joe-red);
            border-color: #fff;
            transform: scale(1.1);
        }

        .anime-info {
            margin-top: 25px;
            padding: 20px;
            background: rgba(179, 18, 18, 0.1);
            border-left: 10px solid var(--joe-red);
        }

        .anime-info h1 {
            font-family: 'Stalinist One';
            margin: 0 0 10px 0;
            font-size: 1.5rem;
            color: var(--joe-red);
        }

        @media (max-width: 1100px) {
            .main-container { grid-template-columns: 1fr; }
            .episode-panel { order: 2; }
        }
    </style>
</head>

        const data = currentSzn === 1 ? SEASON_1 : SEASON_2;
        const count = currentSzn === 1 ? 54 : 47;

        for (let i = 1; i <= count; i++) {
            const btn = document.createElement('div');
            btn.className = 'ep-btn';
            btn.innerText = i;
            btn.onclick = () => loadEpisode(i);
            btn.id = 'ep-' + i;
            grid.appendChild(btn);
        }
    }

    function loadEpisode(num) {
        document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));

        if(activeBtn) activeBtn.classList.add('active');

        const link = data[num];

        }
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
